<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: Android resizes the layout when the keyboard opens.
         Pinch zoom stays allowed (accessibility). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>4TURA Home</title>
    <meta name="theme-color" content="#F2F2F7" />
    <meta name="color-scheme" content="light dark" />

    <!-- Theme and platform before first paint: no flash of the wrong theme.
         Mirrors src/theme/themes.ts and src/app/platform.ts. -->
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var KEY = "uiTheme", OLD = "appTheme";
          var s = localStorage.getItem(KEY);
          if (s === null) {
            var o = localStorage.getItem(OLD);
            if (o !== null) {
              // Old "light" stays light; Dusk, Amber and their predecessors become Dark.
              s = o === "light" ? "light" : "dark";
              localStorage.setItem(KEY, s);
              localStorage.removeItem(OLD);
            }
          }
          if (s !== "light" && s !== "dark") s = "auto";
          var dark = s === "dark" || (s === "auto" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
          d.setAttribute("data-theme", dark ? "dark" : "light");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#000000" : "#F2F2F7");
        } catch (e) {
          d.setAttribute("data-theme", "light");
        }
        try {
          var ua = navigator.userAgent || "";
          var ios = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
          var uaData = navigator.userAgentData;
          var android = /Android/i.test(ua) || (uaData && /android/i.test(uaData.platform || ""));
          d.setAttribute("data-platform", ios ? "ios" : android ? "android" : "other");
          var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
          d.setAttribute("data-standalone", standalone ? "true" : "false");
        } catch (e) {
          d.setAttribute("data-platform", "other");
        }
      })();
    </script>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />

    <!-- iPhone PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="4TURA Home" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--SPLASH-->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
